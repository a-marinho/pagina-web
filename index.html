<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saidinha esse fdsss?</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b6b70;--ac:#ED7D31;--ac2:#fff;--card:#f4f4f6;--bd:#d9d9de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f2f2f4;--mut:#a0a0a8;--card:#242429;--bd:#3a3a41}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#f2f2f4;--mut:#a0a0a8;--card:#242429;--bd:#3a3a41}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Calibri,"Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:20px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:clamp(26px,6vw,38px);margin:0;font-weight:600;line-height:1.15}
.imgs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.imgs img{max-width:100%;max-height:320px;border-radius:12px;object-fit:contain}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:18px;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s}
.opt:active{transform:scale(.98)}
.opt .box{width:22px;height:22px;border:2px solid var(--mut);border-radius:6px;flex:none;display:grid;place-items:center;font-size:15px;color:transparent}
.opt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.opt.on .box{background:var(--ac);border-color:var(--ac);color:#fff}
.opt.single .box{display:none}
.hint{color:var(--mut);font-size:14px;margin:-8px 0 0}
.go{font:inherit;font-size:18px;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
.go[disabled]{opacity:.4;cursor:default}
#no{position:fixed;transition:left .15s,top .15s;z-index:5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .opt{flex:1;justify-content:center;min-width:130px}
.sum{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;font-size:15px}
.msg{color:var(--mut);font-size:15px}
</style></head><body><main id="app"></main>

const WHATSAPP="5531983660041";/* número com DDI+DDD, só dígitos, ex: 5531999999999 */
const ans={};let queue=[],hist=[],cur=1;
const app=document.getElementById("app");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function go(id){cur=id;render()}
function after(dests){
  const uniq=[...new Set(dests)];
  const rest=uniq.filter(d=>d!==7&&d!==13);
  if(!rest.length)return next(uniq[0]);
  const first=rest.shift();
  queue=[...rest,...queue];
  go(first);
}
function next(dest){
  if((dest===7||dest===13)&&queue.length){
    const q=queue.shift();
    if(q!==dest&&!queue.includes(dest))queue.push(dest);
    go(q);
  } else go(dest);
}
function render(){
  const s=D[cur];document.getElementById("no")?.remove();app.replaceChildren();window.scrollTo(0,0);
  app.append(el("h1","",s.t));
  const im=el("div","imgs");s.i.forEach(src=>{const i=new Image();i.src=src;i.alt="";im.append(i)});app.append(im);
  if(cur===7||cur===13)return end();
  if(cur===1)return start(s);
  if(!s.m)return single(s);
  multi(s);
}
function start(s){
  const r=el("div","row");
  s.o.forEach(o=>{const b=el("button","opt single",o.l);b.style.justifyContent="center";b.onclick=()=>{ans[1]=[o.l];go(o.n)};r.append(b)});
  const no=el("button","opt single","Não");no.id="no";no.style.justifyContent="center";
  const run=e=>{e.preventDefault();const w=innerWidth-110,h=innerHeight-60;no.style.left=Math.max(8,Math.random()*w)+"px";no.style.top=Math.max(8,Math.random()*h)+"px"};
  no.addEventListener("pointerenter",run);no.addEventListener("pointerdown",run);no.addEventListener("click",run);
  r.append(no);app.append(r);
  const ph=el("button","opt single","Não");ph.style.visibility="hidden";ph.style.flex="1";r.replaceChild(ph,no);
  document.body.append(no);
  const place=()=>{const b=ph.getBoundingClientRect();no.style.left=b.left+"px";no.style.top=b.top+"px";no.style.width=b.width+"px"};
  requestAnimationFrame(place);addEventListener("resize",place,{once:true});
}
function single(s){
  const r=el("div","row");
  s.o.forEach(o=>{const b=el("button","opt single",o.l);b.style.justifyContent="center";b.onclick=()=>{ans[cur]=[o.l];if(cur===12&&o.l==="Não")ans[12]=["Não"];next(o.n)};r.append(b)});
  app.append(r);
}
function multi(s){
  const sel=new Set();
  app.append(el("p","hint","Pode escolher mais de uma opção"));
  const w=el("div","opts");
  const btn=el("button","go","Continuar");btn.disabled=true;
  s.o.forEach((o,k)=>{const b=el("button","opt");const bx=el("span","box","✓");b.append(bx,el("span","",o.l));
    b.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("on",sel.has(k));btn.disabled=!sel.size};w.append(b)});
  btn.onclick=()=>{const ch=[...sel].sort((a,b)=>a-b).map(k=>s.o[k]);ans[cur]=ch.map(o=>o.l);
    let d=ch.map(o=>o.n);
    if(cur===11)d=ch.some(o=>o.n===13)?[13]:[12];
    if(cur===4||cur===5||cur===10){after(d)}else next(d[0]);};
  app.append(w,btn);
}
function summary(){
  let t="Respostas da saidinha:\n";
  Object.keys(ans).map(Number).sort((a,b)=>a-b).forEach(k=>{if(k===1&&ans[k][0]==="Animo"&&false)return;t+="\n• "+D[k].t.replace(/\s*\(.*\)/,"")+" → "+ans[k].join(", ")});
  return t;
}
function end(){
  const sum=summary();
  app.append(el("p","msg","Revise e envie. Suas respostas vão por mensagem."));
  const b=el("button","go","Enviar resposta");
  const out=el("div","sum",sum);out.hidden=true;
  b.onclick=async()=>{
    const text=sum;
    if(WHATSAPP){location.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(text);return}
    try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(text);out.hidden=false;b.textContent="Copiado! Cole na conversa com ele 😉"}catch(e){out.hidden=false;b.textContent="Copie o texto acima e mande pra ele"}
  };
  app.append(b,out);
}
render();
</script></body></html>
